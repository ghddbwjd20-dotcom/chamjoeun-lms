<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>과정 상세 | 참조은다문화 LMS</title>
<link rel="icon" href="assets/logo.png" type="image/png">
<link rel="stylesheet" href="assets/lms.css">
</head>
<body>
<header>
  <div class="topbar"><div class="wrap"><span>온라인 강의실</span><a data-public="index.html">기관 홈페이지로</a></div></div>
  <div class="wrap nav">
    <a class="brand" href="index.html"><img src="assets/logo.png" alt=""><span>참조은다문화 <small>Classroom / LMS</small></span></a>
    <nav><ul class="gnb"><li><a href="index.html">강의실 안내</a></li><li><a class="is-on" href="courses.html">교육과정</a></li><li><a href="classroom.html">나의 강의실</a></li><li><a href="account.html">마이페이지</a></li></ul></nav>
    <a class="nav-cta" href="login.html">로그인</a>
  </div>
</header>
<main>
<section class="hero"><div class="wrap" id="head"></div></section>
<section class="section"><div class="wrap">
  <div class="split">
    <div>
      <p class="kicker">Curriculum</p>
      <h2>커리큘럼</h2>
      <div class="lessons" id="lessons"></div>
    </div>
    <div class="box" id="applyBox"></div>
  </div>
</div></section>
</main>
<script src="assets/lms.js"></script>
<script>
const c=LMS.course(new URLSearchParams(location.search).get("id"))||LMS.courses[0];
document.title=c.name+" | 참조은다문화 LMS";
document.getElementById("head").innerHTML='<p class="crumb"><a href="courses.html">교육과정</a> · '+c.cat+'</p><p class="kicker">'+(c.type==="paid"?"유료":"무료")+'</p><h1>'+c.name+'</h1><p class="lead">'+c.desc+'</p><div class="meta"><span>기간 '+c.period+'</span><span>강사 '+c.teacher+'</span><span>'+LMS.money(c.price)+'</span></div>';
document.getElementById("lessons").innerHTML=c.lessons.map(function(n,i){return "<button type='button'><span>0"+(i+1)+" "+n+"</span><b>차시</b></button>";}).join("");
let action="";
if(!LMS.user()) action='<a class="btn fill" href="login.html?next='+encodeURIComponent("course.html?id="+c.id)+'">로그인 후 신청</a>';
else if(LMS.isEnrolled(c.id)) action='<a class="btn fill" href="lesson.html?id='+c.id+'">강의실 열기</a>';
else if(c.type==="paid") action='<a class="btn fill" href="pay.html?id='+c.id+'">결제하고 신청</a>';
else action='<button class="btn fill" type="button" id="go">무료 수강신청</button>';
document.getElementById("applyBox").innerHTML="<h3>수강신청</h3><p>신청하면 나의 강의실에서 이어서 듣습니다. 유료 과정은 결제 완료 후 권한이 열립니다.</p><div class='actions'>"+action+"</div>";
const go=document.getElementById("go");
if(go) go.onclick=function(){LMS.enroll(c.id);location.href="lesson.html?id="+c.id;};
</script>
</body>
</html>
