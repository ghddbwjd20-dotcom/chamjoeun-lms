<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>결제 | 참조은다문화 LMS</title>
<link rel="icon" href="assets/logo.png" type="image/png">
<link rel="stylesheet" href="assets/lms.css">
</head>
<body>
<header>
  <div class="topbar"><div class="wrap"><span>온라인 강의실</span><a data-public="index.html">기관 홈페이지로</a></div></div>
  <div class="wrap nav">
    <a class="brand" href="index.html"><img src="assets/logo.png" alt=""><span>참조은다문화 <small>Classroom / LMS</small></span></a>
    <nav><ul class="gnb"><li><a href="courses.html">교육과정</a></li><li><a href="account.html">마이페이지</a></li></ul></nav>
  </div>
</header>
<main>
<section class="hero"><div class="wrap"><p class="kicker">Payment</p><h1>수강료 결제</h1><p class="lead">오픈 시 협의된 PG의 카드결제로 연결합니다. 지금은 성공 화면만 보여 주는 시안입니다.</p></div></section>
<section class="section"><div class="wrap">
  <div class="auth" id="box"></div>
</div></section>
</main>
<script src="assets/lms.js"></script>
<script>
if(!LMS.requireAuth("pay.html"+location.search)) throw "auth";
const c=LMS.course(new URLSearchParams(location.search).get("id"))||LMS.courses[1];
document.getElementById("box").innerHTML="<h2>"+c.name+"</h2><p>강사 "+c.teacher+" · "+c.period+"</p><p><strong>"+LMS.money(c.price)+"</strong></p><div class='actions'><button class='btn fill' id='ok' type='button'>카드 결제(시안)</button><a class='btn line' href='course.html?id="+c.id+"'>취소</a></div><p class='note'>쿠폰·포인트·정기결제·부분환불은 계약 제외입니다.</p>";
document.getElementById("ok").onclick=function(){
  LMS.pay(c.id);
  location.href="lesson.html?id="+c.id;
};
</script>
</body>
</html>
